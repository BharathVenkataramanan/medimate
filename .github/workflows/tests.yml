name: MediMate cross-platform regression
on: [push, pull_request]
jobs:
  tests:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    env:
      TZ: Asia/Singapore
      PYTHONWARNINGS: ignore
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check both real reference databases are included
        run: python -B verify_repo_ready.py
      - name: Python regression checks
        run: python -B -m unittest discover -s tests -p 'test_*.py' -v
      - name: JavaScript regression checks
        shell: bash
        run: |
          for f in tests/test_*.js; do node "$f" || exit 1; done
